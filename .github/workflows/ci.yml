# ============================================================
# CI — every check that exists, on every pull request.
#
# The point of this file is that the suites stop being something a person
# remembers to run. Two of the three defects that reached the browser during
# this build (a modal that reported success on a rejected requirement, and a
# palette migration that turned four dashboards unreadable) were only ever
# caught by running the browser suite by hand.
#
# It stands up a real PostgreSQL, runs the migrations against it, boots the
# production build, and drives the whole thing — so a green tick here means
# the app actually served the flow, not that it compiled.
# ============================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coe_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway database and secret, alive only for the length of this job.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/coe_ci
      DATABASE_SSL: 'off'
      AUTH_SECRET: ci-only-not-a-real-secret-000000000000000000
      APP_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      # Fast hashing: CI is not a password-strength benchmark, and the default
      # of 12 makes the seed step dominate the run.
      BCRYPT_ROUNDS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Migrate
        run: npm run db:migrate

      - name: Write CI fixtures
        # seed.ts only GENERATES passwords when seed/fixtures.json is absent —
        # it prints them once and never writes the file. So CI writes the file
        # first and the seed reads it, which makes the credentials the suites
        # need deterministic instead of something to scrape out of stdout.
        #
        # These are throwaway logins for a database that lives ~10 minutes.
        # They still satisfy the app's own password policy, because the seed
        # is the same code path real accounts go through.
        run: |
          cat > seed/fixtures.json <<'JSON'
          {
            "seedVenueVendors": true,
            "seedPilotCompanies": false,
            "venueEmailDomain": "coe-dev.local",
            "accounts": [
              { "email": "admin@coe-dev.local", "password": "ci-Admin-Throwaway-71", "role": "admin" },
              { "email": "hr@nexus-dev.local", "password": "ci-Corp-Throwaway-71", "role": "corporate",
                "companyName": "Nexus Technologies", "city": "Gurugram" },
              { "email": "ops@royalfeast-dev.local", "password": "ci-Vendor-Throwaway-71", "role": "vendor",
                "companyName": "Royal Feast Caterers", "category": "food", "city": "Gurugram",
                "gstNumber": "06AAACD1234A1ZL" },
              { "email": "ops@cyberhubgourmet-dev.local", "password": "ci-Vendor2-Throwaway-71", "role": "vendor",
                "companyName": "Cyber Hub Gourmet", "category": "food", "city": "Gurugram",
                "gstNumber": "06AAACD1234A1ZL" }
            ]
          }
          JSON

      - name: Seed
        # seedPilotCompanies is false above: the 116 outreach placeholders are
        # demo data and add ~40s of bcrypt to every run for nothing.
        run: npm run db:seed

      - name: Test credentials
        run: |
          {
            echo "TEST_ADMIN_EMAIL=admin@coe-dev.local"
            echo "TEST_ADMIN_PASSWORD=ci-Admin-Throwaway-71"
            echo "TEST_VENDOR_EMAIL=ops@royalfeast-dev.local"
            echo "TEST_VENDOR_PASSWORD=ci-Vendor-Throwaway-71"
            echo "TEST_VENDOR2_EMAIL=ops@cyberhubgourmet-dev.local"
            echo "TEST_VENDOR2_PASSWORD=ci-Vendor2-Throwaway-71"
          } >> "$GITHUB_ENV"

      - name: Start the server
        run: |
          npm run start &
          npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: API suite (66 checks)
        run: npm run test:api

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser suite (33 checks)
        run: npm run test:e2e

      - name: Contrast audit
        # Reported, never gating: text over a CSS gradient is a known false
        # positive, so a number here is for a human to read, not a wall.
        continue-on-error: true
        run: npm run test:contrast

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/coe-e2e
          if-no-files-found: ignore
          retention-days: 7
